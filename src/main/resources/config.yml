    chat: "<sprite:item/oak_sign>"
    notifications: "<sprite:item/bell>"
    pvp: "<sprite:item/diamond_sword>"
    visuals: "<sprite:item/blaze_rod>"
    privacy: "<sprite:item/iron_door>"
    general: "<sprite:item/paper>"
  settings:
    public_chat: "<sprite:item/writable_book>"
    private_messages: "<sprite:item/paper>"
    server_chat_messages: "<sprite:item/book>"
    server_hotbar_messages: "<sprite:item/name_tag>"
    advancement_messages: "<sprite:item/knowledge_book>"
    pay_alerts: "<sprite:item/gold_ingot>"
    teleport_alerts: "<sprite:item/ender_pearl>"
    auction_alerts: "<sprite:item/emerald>"
    shard_reward_alerts: "<sprite:item/amethyst_shard>"
    fast_crystals: "<sprite:item/end_crystal>"
    totem_particles: "<sprite:item/totem_of_undying>"
    explosion_particles: "<sprite:item/gunpowder>"
    item_worth_lore: "<sprite:item/gold_nugget>"
    teleport_confirm_menu: "<sprite:item/ender_eye>"
    teleport_requests: "<sprite:item/compass>"
    allow_payments: "<sprite:item/gold_ingot>"
    randomised_coords: "<sprite:item/spyglass>"
    auction_quick_buy: "<sprite:item/emerald>"
    auction_quick_sell: "<sprite:item/gold_ingot>"
    phantom_spawning: "<sprite:item/phantom_membrane>"
    night_vision: "<sprite:item/golden_carrot>"
